name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python deps
        run: python -m pip install pytest

      - name: Converter tests
        run: python -m pytest tools/ -q

      - name: Theme conversion round-trip
        run: >
          python tools/extract_themes.py roundtrip
          --source vendor/upstream/windows-11-taskbar-styler.wh.cpp

      - name: Committed themes match source
        shell: bash
        run: |
          rm -rf /tmp/themes-check
          python tools/extract_themes.py convert \
            --source vendor/upstream/windows-11-taskbar-styler.wh.cpp \
            --out /tmp/themes-check --credits themes/credits.json
          diff -rq --exclude=credits.json themes/ /tmp/themes-check/
          echo "committed themes/ matches a fresh conversion from source"

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Artefatos do TAP e do CLI existem
        shell: bash
        run: |
          test -f build/src/cli/TaskbarStyler.Tap.dll
          test -f build/src/cli/taskbar-styler.exe

      - name: Nenhuma API de injecao no codigo
        shell: bash
        run: |
          ! grep -rnE 'VirtualAllocEx|WriteProcessMemory|CreateRemoteThread|SetThreadContext' src/
